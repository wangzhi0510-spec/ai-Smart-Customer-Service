name: ai-smart-customer-service

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  APP_CORS_ORIGINS: '["http://localhost:5173"]'
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ai_customer_service}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_customer_service}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MILVUS_HOST: milvus
  MILVUS_PORT: 19530
  MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
  MILVUS_COLLECTION: ${MILVUS_COLLECTION:-customer_service_chunks}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  LLM_MODEL: ${LLM_MODEL:-qwen-plus}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  EMBEDDING_MODEL_PATH: /models/embedding/bge-m3
  RERANKER_MODEL_PATH: /models/reranker/bge-reranker-large
  MODEL_DEVICE: ${MODEL_DEVICE:-auto}
  DOCUMENT_STORAGE_PATH: /app/backend/storage/documents
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
  DAILY_QUESTION_LIMIT: ${DAILY_QUESTION_LIMIT:-100}
  MAX_QUESTION_LENGTH: ${MAX_QUESTION_LENGTH:-500}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_customer_service}
      MYSQL_USER: ${MYSQL_USER:-ai_customer_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app-network]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCDCTL_API: "3"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

  milvus:
    image: milvusdb/milvus:v2.4.17
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [app-network]

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment: *backend-environment
    command: >-
      sh -c "cd /app/backend && alembic upgrade head && cd /app &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - document_data:/app/backend/storage/documents
      - ${MODEL_HOST_PATH:-./model}:/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app-network]

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment: *backend-environment
    command: celery -A backend.app.workers.celery_app:celery_app worker --loglevel=INFO --queues=documents
    volumes:
      - document_data:/app/backend/storage/documents
      - ${MODEL_HOST_PATH:-./model}:/models:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-network]

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  document_data:

networks:
  app-network:
    driver: bridge
